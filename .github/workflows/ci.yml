name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, unit tests, build, bundle and header checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Synthetic values only. Server-only variables are unique sentinels so the
      # bundle scan can prove their VALUES never reach the browser.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-synthetic-publishable-key-0123456789
      APP_BASE_URL: http://localhost:3000
      WORKSPACE_DOMAIN: gocirkla.com
      # Gmail on with synthetic values, so the bundle scan also proves the
      # Gmail client secret and encryption key never reach the browser.
      FEATURE_GMAIL: "on"
      FEATURE_SLACK: "off"
      GOOGLE_GMAIL_CLIENT_ID: ci-synthetic-client.apps.googleusercontent.com
      GOOGLE_GMAIL_CLIENT_SECRET: ci-sentinel-gmail-secret-93fd2a
      TOKEN_ENCRYPTION_KEY: Y2ktc2VudGluZWwta2V5LTMyLWJ5dGVzLWxvbmctISE=
      SUPABASE_SERVICE_ROLE_KEY: ci-sentinel-service-role-6c1d0b7f
      DATABASE_URL: postgres://ci-sentinel-user:ci-sentinel-pass-41aa@localhost:5432/none
      # Scan on with sentinels so the bundle scan proves these never reach browsers.
      FEATURE_SCAN: "on"
      CRON_SECRET: ci-sentinel-cron-secret-5b7e9c1a2d4f6e8a0c
      WORKER_DATABASE_URL: postgres://c360_worker:ci-sentinel-worker-pass-7d2e@localhost:5432/none
      # Extraction stays off; the key sentinel proves it never reaches browsers.
      FEATURE_EXTRACT: "off"
      ANTHROPIC_API_KEY: ci-sentinel-anthropic-key-7a1b2c3d4e5f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:headers

  database:
    name: Migrations and pgTAP tests (local Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Starts only the database container; no hosted project is involved.
      - run: supabase db start
      - run: supabase test db

  database-all:
    name: All migrations incl. pending 0008 - pgTAP, rollback and re-apply (temporary PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pgTAP for the runner's PostgreSQL 16; no service or hosted project is used.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
      - run: PGBIN=/usr/lib/postgresql/16/bin bash scripts/db-test-local.sh

  scan-e2e:
    name: End-to-end - scan, extraction, full pipeline (synthetic mailbox, temporary PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner image ships PostgreSQL 16 binaries; no service or hosted project is used.
      - run: PGBIN=/usr/lib/postgresql/16/bin bash scripts/scan-e2e-local.sh

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
